[package]
name = "vrc-openface"
version = "0.6.0"
edition = "2024"
rust-version = "1.95"
description = "Webcam face tracking for VRChat: MediaPipe blendshapes to Unified Expressions over OSC"
license = "MIT"
repository = "https://github.com/setsumi-vrc/VRC-Openface"
publish = false

[[bin]]
name = "vrc-openface"
path = "src/main.rs"

[features]
default = ["directml"]
directml = ["ort/directml"]

[dependencies]
anyhow = "1.0"
crossbeam-channel = "0.5"
directories = "6.0"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "persistence"] }
egui = { version = "0.37", default-features = false, features = ["monochrome_emoji_fonts"] }
env_logger = "0.11"
log = "0.4"
mdns-sd = "0.21"
ort = { version = "2.0.0-rc.15" }
parking_lot = "0.13"
rosc = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rfd = "0.17"
ureq = "3.5"
zip = { version = "9.1", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
tray-icon = { version = "0.24", default-features = false }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Gdi",
    "Win32_Media",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(not(windows))'.dependencies]
nokhwa = { version = "0.10", features = ["input-native"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.dev.package."*"]
opt-level = 3
